<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Lagrange Shop Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #eef2e6 0%, #d9e3cf 100%); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 32px; padding: 40px; max-width: 440px; width: 90%; margin: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .btn { background: #6b705c; transition: 0.2s; width: 100%; color: white; border: none; padding: 12px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #5a5f4a; transform: scale(1.02); }
        input { border: 1.5px solid #e2e8d5; border-radius: 16px; padding: 12px 16px; width: 100%; margin: 8px 0; }
        input:focus { outline: none; border-color: #6b705c; }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo span { font-size: 48px; }
        .logo h1 { font-size: 24px; font-weight: 700; color: #3a5e3a; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo"><span>🛒</span><h1>Lagrange</h1><p>Shop Manager Pro</p></div>
    <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Mot de passe">
        <div id="loginError" class="text-red-500 text-sm mb-3"></div>
        <button class="btn" onclick="login()">Se connecter</button>
        <p class="text-center mt-4"><a href="#" onclick="showRegister()" class="text-green-700">Créer un compte</a></p>
    </div>
    <div id="registerForm" style="display:none">
        <input type="text" id="regFullName" placeholder="Nom complet">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Mot de passe">
        <input type="password" id="regConfirm" placeholder="Confirmer">
        <input type="text" id="regPromo" placeholder="Code promo (LAGRANGE100)">
        <div id="regError" class="text-red-500 text-sm mb-3"></div>
        <button class="btn" onclick="register()">S'inscrire</button>
        <p class="text-center mt-4"><a href="#" onclick="showLogin()" class="text-green-700">Déjà un compte ?</a></p>
    </div>
</div>
<script>
    if (localStorage.getItem('token')) window.location.href = '/';
    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (res.ok) { localStorage.setItem('token', data.token); window.location.href = '/'; }
        else document.getElementById('loginError').innerText = data.error || 'Erreur';
    }
    async function register() {
        const fullName = document.getElementById('regFullName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const promoCode = document.getElementById('regPromo').value;
        if (password !== confirm) { document.getElementById('regError').innerText = 'Les mots de passe ne correspondent pas'; return; }
        const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fullName, email, password, promoCode }) });
        const data = await res.json();
        if (res.ok) { localStorage.setItem('token', data.token); window.location.href = '/'; }
        else document.getElementById('regError').innerText = data.error || 'Erreur';
    }
    function showRegister() { document.getElementById('loginForm').style.display = 'none'; document.getElementById('registerForm').style.display = 'block'; }
    function showLogin() { document.getElementById('registerForm').style.display = 'none'; document.getElementById('loginForm').style.display = 'block'; }
</script>
</body>
</html>
